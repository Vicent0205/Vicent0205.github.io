    Experience:
      - company: Apple MLR
        position: Research Scientist Intern
        location: Cupertino, USA
        start_date: 2026-04
        end_date: 2026-09
        highlights:
          - Mentored by [Yizhe Zhang](https://scholar.google.com/citations?user=WDVMfggAAAAJ) and [Ruixiang Zhang](https://scholar.google.com/citations?user=VQYdApgAAAAJ).
          - Developed **RSI-Inference** (working paper, first author), a benchmark for evaluating whether coding agents can autonomously develop and maintain
            **vLLM and SGLang** in GPU-backed sandboxes.
          - "**Model support:** Native integration of previously unsupported architectures (e.g., DeepSeek-V4), evaluated through correctness and serving-feature
            checks."
          - "**Optimization:** Source-code changes to accelerate models already supported by the engine, measuring throughput and latency under fixed deployment
            settings on H100 and B200 GPUs."
          - In the reported evaluation snapshot, Sonnet-5.5 and Opus-5.5 led the overall ranking, with optimization speedups of **1.68× and 1.48×** and model-support pass@1 of **27.8% and 16.7%**,
            respectively. DeepSeek-V4.1-Flash achieved **0.0%** support pass@1 and **1.24×** speedup.
      - company: MiniMax
        position: Research Intern
        location: Shanghai, China
        start_date: 2025-02
        end_date: 2026-02
        highlights:
          - Core contributor to MiniMax-M1 and MiniMax-M2.
          - "**Logical reasoning:** Developed [**SynLogic**](https://arxiv.org/abs/2505.19641) (first author, NeurIPS 2025), synthesizing rule-verifiable data
            across 35 logical task types for RL with verifiable rewards. SynLogic-32B outperformed DeepSeek-R1-Distill-Qwen-32B on BBEH (**25.5% vs. 19.2%**).
            This data and RL work contributed to **MiniMax-M1**."
          - "**Search agents:** Developed [**WebExplorer**](https://arxiv.org/abs/2509.06501) (first author), synthesizing challenging search tasks through
            web exploration and query evolution, and explored RL training. WebExplorer-8B surpassed WebSailor-72B on BrowseComp-en/zh (Avg@4: **15.7% vs. 12.0%
            / 32.0% vs. 30.1%**). The data was used in **MiniMax-M2** and formed the basis for subsequent **MiniMax-M3** search-data improvements."
      - company: Tencent WXG
        position: Research Intern
        location: Shanghai, China
        start_date: 2024-06
        end_date: 2024-09
        highlights:
          - Mentored by Zifei Shan.
          - "Investigated vision-encoder bottlenecks in VLM chart understanding and trained improved encoders with contrastive learning. First-author paper:
            [**On the Perception Bottleneck of VLMs for Chart Understanding**](https://arxiv.org/abs/2503.18435) (Findings of EMNLP 2025)."
      - company: Shanghai AI Lab
        position: Research Intern
        location: Shanghai, China
        start_date: 2023-06
        end_date: 2023-12
        highlights:
          - Mentored by Prof. Yu Cheng.
          - "Investigated a universal truthfulness hyperplane using probes trained on 40+ datasets; found that data diversity improves cross-dataset generalization.
            First-author paper: [**On the Universal Truthfulness Hyperplane Inside LLMs**](https://arxiv.org/abs/2407.08582) (EMNLP 2024)."
